<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Toggle</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, sans-serif;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			background: #f3f4f6;
			color: #1f2937;
		}

		.password-form {
			width: min(100% - 2rem, 24rem);
			padding: 2rem;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
		}

		h1 {
			margin-top: 0;
			font-size: 1.5rem;
		}

		label {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: 600;
		}

		input[type="password"],
		input[type="text"] {
			box-sizing: border-box;
			width: 100%;
			padding: 0.75rem;
			border: 1px solid #9ca3af;
			border-radius: 4px;
			font-size: 1rem;
		}

		.toggle-control {
			display: flex;
			gap: 0.5rem;
			align-items: center;
			margin: 0.75rem 0 1.25rem;
			font-weight: 400;
		}

		button {
			width: 100%;
			padding: 0.75rem;
			border: 0;
			border-radius: 4px;
			background: #2563eb;
			color: #ffffff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		button:hover {
			background: #1d4ed8;
		}
	</style>
</head>
<body>
	<form class="password-form" action="#" method="post">
		<h1>Create a password</h1>
		<label for="password">Password</label>
		<input id="password" name="password" type="password" autocomplete="new-password" required>

		<label class="toggle-control" for="show-password">
			<input id="show-password" type="checkbox">
			Show password
		</label>

		<button type="submit">Submit</button>
	</form>

	<script>
		const passwordInput = document.querySelector('#password');
		const showPasswordToggle = document.querySelector('#show-password');

		showPasswordToggle.addEventListener('change', () => {
			passwordInput.type = showPasswordToggle.checked ? 'text' : 'password';
		});
	</script>
</body>
</html>
