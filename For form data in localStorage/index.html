<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Saved Contact Form</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #eef2ff;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			padding: 1rem;
			box-sizing: border-box;
		}

		main {
			width: min(100%, 32rem);
			padding: 2rem;
			background: #ffffff;
			border-radius: 8px;
			box-shadow: 0 8px 24px rgb(31 41 55 / 12%);
		}

		h1 {
			margin-top: 0;
		}

		form {
			display: grid;
			gap: 1rem;
		}

		label {
			display: grid;
			gap: 0.4rem;
			font-weight: 600;
		}

		input,
		textarea,
		button {
			box-sizing: border-box;
			width: 100%;
			padding: 0.7rem;
			border: 1px solid #cbd5e1;
			border-radius: 4px;
			font: inherit;
		}

		textarea {
			min-height: 8rem;
			resize: vertical;
		}

		.consent {
			display: flex;
			grid-template-columns: auto 1fr;
			align-items: center;
			gap: 0.5rem;
		}

		.consent input {
			width: auto;
		}

		button {
			border-color: #4338ca;
			background: #4338ca;
			color: #ffffff;
			cursor: pointer;
			font-weight: 600;
		}

		button:hover {
			background: #3730a3;
		}

		#status {
			min-height: 1.5rem;
			margin: 0;
			color: #166534;
		}
	</style>
</head>
<body>
	<main>
		<h1>Contact us</h1>
		<p>Your draft is saved automatically in this browser.</p>

		<form id="contact-form">
			<label for="name">Name
				<input id="name" name="name" type="text" autocomplete="name" required>
			</label>

			<label for="email">Email
				<input id="email" name="email" type="email" autocomplete="email" required>
			</label>

			<label for="message">Message
				<textarea id="message" name="message" required></textarea>
			</label>

			<label class="consent" for="updates">
				<input id="updates" name="updates" type="checkbox">
				Send me occasional updates
			</label>

			<button type="submit">Submit</button>
			<p id="status" role="status" aria-live="polite"></p>
		</form>
	</main>

	<script>
		function persistForm(form, storageKey) {
			const fields = Array.from(form.elements).filter((field) => field.name);

			function readSavedData() {
				try {
					return JSON.parse(localStorage.getItem(storageKey)) || {};
				} catch (error) {
					return {};
				}
			}

			function saveFormData() {
				const formData = {};

				fields.forEach((field) => {
					formData[field.name] = field.type === 'checkbox'
						? field.checked
						: field.value;
				});

				localStorage.setItem(storageKey, JSON.stringify(formData));
			}

			function restoreFormData() {
				const savedData = readSavedData();

				fields.forEach((field) => {
					if (!(field.name in savedData)) {
						return;
					}

					if (field.type === 'checkbox') {
						field.checked = savedData[field.name];
					} else {
						field.value = savedData[field.name];
					}
				});
			}

			restoreFormData();
			form.addEventListener('input', saveFormData);
			form.addEventListener('change', saveFormData);

			return {
				clear() {
					localStorage.removeItem(storageKey);
				}
			};
		}

		const contactForm = document.querySelector('#contact-form');
		const status = document.querySelector('#status');
		const formPersistence = persistForm(contactForm, 'contact-form-draft');

		contactForm.addEventListener('submit', (event) => {
			event.preventDefault();
			formPersistence.clear();
			contactForm.reset();
			status.textContent = 'Thanks! Your message was submitted.';
		});
	</script>
</body>
</html>
